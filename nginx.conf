server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - ищет статические файлы SSG, затем index.html
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Кешировать assets на год
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Кешировать JS/CSS chunks
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Кешировать изображения
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript image/svg+xml;
}
